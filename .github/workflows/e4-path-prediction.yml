name: NovaATHENA E4 closed path prediction
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  e4:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[RUN] NovaATHENA E4 closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: structural
      - name: E4 causal full path
        run: |
          set -euo pipefail
          python3 -u scripts/e4_path_prediction.py | tee e4.log
          grep -q 'E4_AUDIT_PASS traces 38 rows 114' e4.log
          test "$(grep -c '^E4_TRACE ' e4.log)" -eq 38
          python3 -m json.tool e4-results/manifest.json >/dev/null
          cp e4.log e4-results/
          echo "${{ github.sha }}" > e4-results/commit.txt
          echo "${{ github.run_id }}" > e4-results/run_id.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaathena-e4-closed
          path: e4-results/
          retention-days: 90
      - name: Report
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "E4 run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} status ${{ job.status }} commit ${{ github.sha }} artifact novaathena-e4-closed"

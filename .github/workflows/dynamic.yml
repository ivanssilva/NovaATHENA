name: ATHENA dynamic RV32 characterization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/dynamic_*.py'
      - 'scripts/pattern_taxonomy.py'
      - 'benchmarks/start.S'
      - '.github/workflows/dynamic.yml'
jobs:
  dynamic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install RV32 tools and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Generate controlled kernels
        run: python3 scripts/generate_kernels.py
      - name: Preflight Python syntax and QEMU parser fixture
        run: |
          python3 -m py_compile scripts/dynamic_trace.py scripts/dynamic_mapper.py scripts/pattern_taxonomy.py
          cat > /tmp/qemu-fixture.log <<'EOF'
          ----------------
          IN:
          0x000100f8:  00000097          auipc                   ra,0
          0x000100fc:  010080e7          jalr                    ra,ra,16

          Trace 0: 0x7fb488000100 [00000000/00000000000100f8/04018078/00000200]
          EOF
          python3 scripts/dynamic_trace.py /tmp/qemu-fixture.log /tmp/qemu-fixture.csv
          test "$(wc -l < /tmp/qemu-fixture.csv)" -eq 3
      - name: Execute RV32 ELF and reconstruct dynamic instruction traces
        run: |
          mkdir -p dynamic-results
          for SRC in benchmarks/generated/*.c; do
            NAME=$(basename "$SRC" .c)
            for OPT in 0 2 3; do
              ELF="dynamic-results/${NAME}_O${OPT}.elf"
              riscv64-linux-gnu-gcc -march=rv32im -mabi=ilp32 -O"$OPT" -ffreestanding -fno-builtin -nostdlib -static -Wl,-e,_start -Wl,--no-relax benchmarks/start.S "$SRC" -o "$ELF"
              qemu-riscv32 -d in_asm,exec,nochain -D "dynamic-results/${NAME}_O${OPT}.qemu.log" "$ELF" || STATUS=$?
              python3 scripts/dynamic_trace.py "dynamic-results/${NAME}_O${OPT}.qemu.log" "dynamic-results/${NAME}_O${OPT}.trace.csv"
              rm -f "$ELF" "dynamic-results/${NAME}_O${OPT}.qemu.log"
            done
          done
      - name: Map dependency graphs to four topologies
        run: python3 scripts/dynamic_mapper.py
      - name: Classify dependency motifs
        run: python3 scripts/pattern_taxonomy.py
      - name: Print reproducible aggregate comparisons
        run: |
          python3 - <<'PY'
          import csv,collections,statistics
          rows=list(csv.DictReader(open('dynamic-results/dynamic_summary.csv')))
          print('AGGREGATE_START')
          for kind in ('4x4','4x4_1f','pe6','pe6_1f'):
              rr=[r for r in rows if r['topology']==kind]
              for opt in ('O0','O2','O3'):
                  ss=[r for r in rr if r['kernel'].endswith('_'+opt)]
                  print('SUMMARY',kind,opt,'n',len(ss), 'exec',sum(int(r['executed_instructions']) for r in ss),
                    'eligible',sum(int(r['eligible_alu_ops']) for r in ss),
                    'convergent',sum(int(r['convergent_nodes']) for r in ss),
                    'divergent',sum(int(r['divergent_nodes']) for r in ss),
                    'depth3',sum(int(r['depth_ge3']) for r in ss),
                    'configs',sum(int(r['configurations']) for r in ss),
                    'mapped',sum(int(r['mapped_ops']) for r in ss),
                    'fused',sum(int(r['fused_2producer']) for r in ss),
                    'mean_occupancy',round(statistics.mean(float(r['mean_ops_per_configuration']) for r in ss),4))
          print('FAMILY_START')
          for fam in sorted({r['kernel'].split('_v')[0] for r in rows}):
              for kind in ('4x4','4x4_1f','pe6','pe6_1f'):
                  ss=[r for r in rows if r['kernel'].startswith(fam+'_') and r['kernel'].endswith('_O2') and r['topology']==kind]
                  print('FAMILY',fam,kind,'configs',sum(int(r['configurations']) for r in ss),
                    'mapped',sum(int(r['mapped_ops']) for r in ss),
                    'fused',sum(int(r['fused_2producer']) for r in ss))
          print('AGGREGATE_END')
          PY
      - name: Upload dynamic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-rv32-dynamic
          path: dynamic-results/

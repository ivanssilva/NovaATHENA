name: ATHENA Nangate45 physical
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'physical/**'
      - '.github/workflows/physical.yml'
      - 'rtl/**'
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Generate registered wrappers
        run: python3 scripts/generate_physical.py
      - name: Run ORFS
        run: |
          mkdir -p physical-results/orfs
          docker pull openroad/orfs:latest
          for TOP in athena_4x4 athena_pe6 athena_4x4_1f athena_pe6_1f; do
            docker run --rm -v "$PWD":/work -w /OpenROAD-flow-scripts/flow openroad/orfs:latest bash -lc "make DESIGN_CONFIG=/work/physical/$TOP.mk FLOW_VARIANT=$TOP WORK_HOME=/work/physical-results/orfs NUM_CORES=2" > "physical-results/$TOP.log" 2>&1 || echo "$TOP FAILED" >> physical-results/failures.txt
          done
          if test -f physical-results/failures.txt; then cat physical-results/failures.txt; exit 1; fi
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-nangate45-physical
          path: physical-results/

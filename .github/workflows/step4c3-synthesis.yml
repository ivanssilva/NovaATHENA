name: ATHENA Step 4C.3 sparse topology synthesis
on:
  push:
    paths:
      - 'rtl/step4c3_topologies.v'
      - 'scripts/step4c3_synthesis.sh'
      - '.github/workflows/step4c3-synthesis.yml'
  workflow_dispatch:
jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Nangate45 Liberty
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/The-OpenROAD-Project/OpenROAD-flow-scripts.git orfs
          cd orfs
          git sparse-checkout set flow/platforms/nangate45/lib
          test -s flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib
      - name: Install synthesis tools
        run: sudo apt-get update && sudo apt-get install -y yosys cmake build-essential swig bison flex libfl-dev libeigen3-dev libboost-all-dev tcl-dev zlib1g-dev libgtest-dev
      - name: Synthesize and time K4 K5 K6
        run: bash scripts/step4c3_synthesis.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athena-step4c3-synthesis
          path: reports/step4c3/

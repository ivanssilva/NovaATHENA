name: NovaATHENA E7.1 full-writer RAW audit
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions: {contents: read, actions: read, issues: write}
jobs:
  e71:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[RUN] NovaATHENA E7.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: structural
      - name: Execute E7.1 audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/e7_1_raw_dependency_audit.py | tee e7-1.log
          grep -q '^E7_1_AUDIT_PASS traces 38 ' e7-1.log
          test "$(grep -c '^E7_1_TRACE ' e7-1.log)" -eq 38
          python3 -m json.tool e7-1-results/manifest.json >/dev/null
          cp e7-1.log e7-1-results/
          echo "${{ github.sha }}" > e7-1-results/commit.txt
          echo "${{ github.run_id }}" > e7-1-results/run_id.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaathena-e7-1
          path: |
            e7-1-results/
            e7-1.log
          retention-days: 90
      - name: Report issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "E7.1 run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} status ${{ job.status }} commit ${{ github.sha }} artifact novaathena-e7-1"

name: ATHENA Step 5B width-only control
on:
  push:
    paths:
      - 'scripts/step5b_width_control.py'
      - '.github/workflows/step5b-width-control.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Restore immutable validated traces
        run: |
          mkdir -p embench-results
          find source -type f -name '*.trace.csv' -exec cp {} embench-results/ \;
          test "$(find embench-results -name '*.trace.csv' | wc -l)" -eq 38
      - name: Run width-only scientific control
        run: |
          python3 -u scripts/step5b_width_control.py | tee step5b_width_control.log
          grep -q 'STEP5B_WIDTH_AUDIT traces 38 mismatches_generic8_vs_athena_conservative 0' step5b_width_control.log
          grep -q 'STEP5B_WIDTH_RESULT O2' step5b_width_control.log
          grep -q 'STEP5B_WIDTH_RESULT O3' step5b_width_control.log
          grep -q 'STEP5B_WIDTH_CONCLUSION' step5b_width_control.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athena-step5b-width-control
          path: |
            step5b_width_control.log
            step5b_width_control.csv

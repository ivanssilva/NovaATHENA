name: ATHENA Step 5B corrected C2 temporal bound
on:
  push:
    paths:
      - 'scripts/step5b_c2_validation2.py'
      - 'scripts/step5b_c2_corrected.py'
      - '.github/workflows/step5b-c2-corrected.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  validate-and-run:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[RUN] ATHENA Step 5B')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Analytical C2 microcases
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/step5b_c2_validation2.py | tee c2_validation.log
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - run: |
          mkdir -p embench-results
          find source -type f -name '*.trace.csv' -exec cp {} embench-results/ \;
          test "$(find embench-results -name '*.trace.csv' | wc -l)" -eq 38
      - name: Corrected corpus experiment
        shell: bash
        run: |
          set -o pipefail
          python3 -u scripts/step5b_c2_corrected.py | tee c2_corrected.log
          grep -q 'STEP5B_C2_AUDIT traces 38 pairs 38 invariant_c2_le_w8_le_h4 yes' c2_corrected.log
          grep -q 'STEP5B_C2_RESULT O2' c2_corrected.log
          grep -q 'STEP5B_C2_RESULT O3' c2_corrected.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athena-step5b-c2-corrected
          path: |
            c2_validation.log
            c2_corrected.log
            step5b_c2_corrected.csv
      - name: Report run back to trigger issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "ATHENA_STEP5B_RUN_ID $RUN_ID"
            echo "ATHENA_STEP5B_RUN_ATTEMPT $RUN_ATTEMPT"
            echo "ATHENA_STEP5B_HEAD_SHA $HEAD_SHA"
            echo "ATHENA_STEP5B_JOB_STATUS $JOB_STATUS"
            echo
            if [ -f c2_validation.log ]; then
              echo '### Validation'
              echo '~~~'
              cat c2_validation.log
              echo '~~~'
            fi
            if [ -f c2_corrected.log ]; then
              echo '### Corpus summary'
              echo '~~~'
              grep -E 'STEP5B_C2_(AUDIT|RESULT)' c2_corrected.log || true
              echo '~~~'
            fi
          } > run_report.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file run_report.md

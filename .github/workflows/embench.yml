name: ATHENA Embench structural mining
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/embench_template_miner.py'
      - 'scripts/dynamic_trace.py'
      - '.github/workflows/embench.yml'
jobs:
  embench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: athena
      - uses: actions/checkout@v4
        with:
          repository: embench/embench-iot
          ref: 09c2ed8c3b7008c95d08b038de4a3f6dc103ed70
          path: embench
      - name: Install RV32 Linux tools and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc
      - name: Fetch pinned RV32 OpenSBI firmware
        run: |
          wget -q https://github.com/riscv-software-src/opensbi/releases/download/v1.5/opensbi-1.5-rv-bin.tar.xz
          tar xf opensbi-1.5-rv-bin.tar.xz
          test -f opensbi-1.5-rv-bin/share/opensbi/ilp32/generic/firmware/fw_dynamic.bin
      - name: Record and audit Embench source
        run: |
          cd embench
          git rev-parse HEAD | tee ../athena/EMBENCH_REVISION.txt
          test "$(find src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 19
      - name: Create controlled RV32 bare-metal runtime
        run: |
          cat > startup.S <<'EOF'
          .section .text.start
          .globl _start
          _start:
            la sp, __stack_top
            la t0, __bss_start
            la t1, __bss_end
          1:
            bgeu t0, t1, 2f
            sw zero, 0(t0)
            addi t0, t0, 4
            j 1b
          2:
            call main
            li t0, 0x100000
            beqz a0, 3f
            li t1, 0x3333
            sw t1, 0(t0)
          4: j 4b
          3:
            li t1, 0x5555
            sw t1, 0(t0)
          5: j 5b
          EOF
          cat > qemu-virt-rv32.ld <<'EOF'
          ENTRY(_start)
          MEMORY { ram (rwx) : ORIGIN = 0x80000000, LENGTH = 16M }
          SECTIONS {
            . = ORIGIN(ram);
            .text : { KEEP(*(.text.start)) *(.text .text.*) } > ram
            .rodata : { *(.rodata .rodata.*) *(.srodata .srodata.*) } > ram
            .data : { *(.data .data.*) *(.sdata .sdata.*) } > ram
            .bss (NOLOAD) : { __bss_start = .; *(.bss .bss.*) *(.sbss .sbss.*) *(COMMON); __bss_end = .; } > ram
            . = ALIGN(16);
            . = ORIGIN(ram) + LENGTH(ram);
            __stack_top = .;
          }
          EOF
      - name: Create trace harness
        run: |
          cat > runner.c <<'EOF'
          extern void initialise_benchmark(void);
          extern int benchmark(void);
          extern int verify_benchmark(int);
          int main(void) {
            initialise_benchmark();
            int result = benchmark();
            return verify_benchmark(result) == 0 ? 0 : 1;
          }
          EOF
      - name: Compile and trace 19 Embench programs
        run: |
          mkdir -p athena/embench-results
          for DIR in embench/src/*; do
            BENCH=$(basename "$DIR")
            for OPT in 2 3; do
              ELF="athena/embench-results/${BENCH}_O${OPT}.elf"
              riscv64-unknown-elf-gcc --specs=/usr/lib/picolibc/riscv64-unknown-elf/picolibc.specs -nostartfiles -march=rv32im -mabi=ilp32 -O"$OPT" -fno-builtin -Iembench/support -DWARMUP_HEAT=0 -DGLOBAL_SCALE_FACTOR=1 startup.S runner.c "$DIR"/*.c embench/support/beebsc.c -T qemu-virt-rv32.ld -lm -o "$ELF"
              riscv64-unknown-elf-readelf -h -l "$ELF" > "athena/embench-results/${BENCH}_O${OPT}.elf-layout.txt"
              timeout 60s qemu-system-riscv32 -M virt -m 16M -nographic -bios none -kernel "$ELF" -d in_asm,exec,nochain -D "athena/embench-results/${BENCH}_O${OPT}.qemu.log"
              python3 athena/scripts/dynamic_trace.py "athena/embench-results/${BENCH}_O${OPT}.qemu.log" "athena/embench-results/${BENCH}_O${OPT}.trace.csv"
              rm -f "$ELF" "athena/embench-results/${BENCH}_O${OPT}.qemu.log"
            done
          done
          test "$(find athena/embench-results -name '*.trace.csv' | wc -l)" -eq 38
      - name: Audit generated traces
        working-directory: athena
        run: |
          python3 - <<'PY'
          import csv,glob,os
          traces=sorted(glob.glob('embench-results/*.trace.csv'))
          benches={os.path.basename(x).rsplit('_O',1)[0] for x in traces}
          assert len(traces)==38, len(traces)
          assert len(benches)==19, len(benches)
          with open('EMBENCH_REVISION.txt') as f:
              rev=f.read().strip()
          assert rev=='09c2ed8c3b7008c95d08b038de4a3f6dc103ed70', rev
          out=[]
          for p in traces:
              with open(p,newline='') as f:
                  n=sum(1 for _ in csv.DictReader(f))
              assert n>0, p
              out.append((os.path.basename(p),n))
          with open('embench-results/pre_mining_trace_audit.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['trace','rows']); w.writerows(out)
          print('AUDIT traces',len(traces),'benchmarks',len(benches),'revision',rev,
                'min_rows',min(n for _,n in out),'max_rows',max(n for _,n in out),
                'total_rows',sum(n for _,n in out))
          PY
      - name: Mine recurrent topology-agnostic templates
        working-directory: athena
        run: python3 scripts/embench_template_miner.py
      - name: Audit mining results
        working-directory: athena
        run: |
          python3 - <<'PY'
          import csv,glob,os
          traces=glob.glob('embench-results/*.trace.csv')
          rows=list(csv.DictReader(open('embench-results/recurrent_templates.csv')))
          print('AUDIT traces',len(traces),'benchmarks',len({os.path.basename(x).rsplit('_O',1)[0] for x in traces}))
          for opt in ('O2','O3'):
              r=[x for x in rows if x['opt']==opt]
              print('AUDIT',opt,'templates',len(r),'recurrent_nonoverlap',sum(int(x['nonoverlap_occurrences'])>=2 for x in r),'cross_benchmark',sum(int(x['benchmark_prevalence'])>=2 for x in r))
          PY
      - name: Derive timing-neutral candidate G_t families
        working-directory: athena
        run: python3 scripts/embench_gt_extractor.py
      - name: Audit candidate G_t outputs
        working-directory: athena
        run: |
          python3 - <<'PY'
          import csv,glob
          rows=list(csv.DictReader(open('embench-results/gt_audit.csv')))
          assert len(rows)==38*3, len(rows)
          for D in ('1','2','3'):
              r=[x for x in rows if x['D']==D]
              assert len(r)==38, (D,len(r))
              assert all(int(x['covered_alu_ops'])>0 for x in r)
              print('GT_AUDIT D',D,'traces',len(r),
                    'groups',sum(int(x['candidate_Gt']) for x in r),
                    'covered_alu_ops',sum(int(x['covered_alu_ops']) for x in r),
                    'max_group_ops',max(int(x['max_group_ops']) for x in r))
          PY
      - name: Upload structural measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-embench-structural
          compression-level: 9
          path: |
            athena/embench-results/
            athena/EMBENCH_REVISION.txt

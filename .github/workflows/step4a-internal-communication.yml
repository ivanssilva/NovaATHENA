name: ATHENA Step 4A internal communication census
on:
  push:
    paths:
      - 'scripts/step4a_internal_communication.py'
      - '.github/workflows/step4a-internal-communication.yml'
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated exact signatures
        uses: actions/download-artifact@v4
        with:
          run-id: 37145305760
          name: athena-embench-gt-capacity-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Analyze internal communication
        run: |
          set -euo pipefail
          src="$(find input -type f -name gt_capacity_benchmark_signature_counts.csv -print -quit)"
          test -n "$src"
          cp "$src" gt_capacity_benchmark_signature_counts.csv
          python3 scripts/step4a_internal_communication.py | tee step4a_internal_communication.log
      - uses: actions/upload-artifact@v4
        with:
          name: athena-step4a-internal-communication
          path: |
            step4a_internal_communication.csv
            step4a_internal_communication.log

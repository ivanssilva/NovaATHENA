name: ATHENA Step 4C concrete link search
on:
  push:
    paths:
      - 'scripts/step4c_link_search.py'
      - '.github/workflows/step4c-link-search.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated exact signatures
        uses: actions/download-artifact@v4
        with:
          run-id: 37145305760
          name: athena-embench-gt-capacity-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Search concrete directed links
        run: |
          set -euo pipefail
          src="$(find input -type f -name gt_capacity_benchmark_signature_counts.csv -print -quit)"
          test -n "$src"
          cp "$src" gt_capacity_benchmark_signature_counts.csv
          python3 scripts/step4c_link_search.py | tee step4c_link_search.log
          grep -q 'STEP4C_AUDIT benchmark_opt_pairs 38' step4c_link_search.log
          grep -q 'STEP4C_LIMITATION' step4c_link_search.log
      - uses: actions/upload-artifact@v4
        with:
          name: athena-step4c-link-search
          path: |
            step4c_link_search.csv
            step4c_link_search.log

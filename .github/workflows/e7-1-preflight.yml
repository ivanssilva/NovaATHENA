name: NovaATHENA E7.1 decoder preflight
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions: {contents: read, issues: write}
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[RUN] NovaATHENA E7.1 preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Directed decoder tests
        run: python3 scripts/e7_1_raw_dependency_audit.py --self-test
      - name: Report
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Decoder preflight: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} status ${{ job.status }}"

name: NovaATHENA E7.1 opcode census
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions: {contents: read, actions: read, issues: write}
jobs:
  census:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[RUN] NovaATHENA E7.1 opcode census'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: structural
      - name: Audit all opcodes
        run: |
          set -euo pipefail
          python3 -u scripts/e7_1_opcode_census.py | tee e7-1-census.log
          grep -q '^E7_1_CENSUS_PASS traces 38 ' e7-1-census.log
          cp e7-1-census.log e7-1-census/
          echo "${{ github.sha }}" > e7-1-census/commit.txt
          echo "${{ github.run_id }}" > e7-1-census/run_id.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaathena-e7-1-opcode-census
          path: e7-1-census/
          retention-days: 90
      - name: Report issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "E7.1 opcode census: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} status ${{ job.status }} artifact novaathena-e7-1-opcode-census"

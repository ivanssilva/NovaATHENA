name: NovaATHENA E3 closed K5
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  e3:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[RUN] NovaATHENA E3 closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: structural
      - name: Analyze
        run: |
          python3 -u scripts/e3_k5_closed.py | tee e3.log
          grep -q 'E3_AUDIT_PASS traces 38 rows 152' e3.log
          mkdir -p e3-results
          cp e3.log e3-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaathena-e3-closed
          path: e3-results/
          retention-days: 90
      - name: Report
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "E3 run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} status ${{ job.status }} commit ${{ github.sha }}"

name: NovaATHENA E5 closed causal reuse
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  e5:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[RUN] NovaATHENA E5 closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36850448602
          name: athena-embench-structural
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: structural
      - name: E5 causal reuse
        run: |
          set -euo pipefail
          python3 -u scripts/e5_causal_reuse.py | tee e5.log
          grep -q 'E5_AUDIT_PASS traces 38 rows 114' e5.log
          test "$(grep -c '^E5_TRACE ' e5.log)" -eq 38
          python3 -m json.tool e5-results/manifest.json >/dev/null
          cp e5.log e5-results/
          echo "${{ github.sha }}" > e5-results/commit.txt
          echo "${{ github.run_id }}" > e5-results/run_id.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaathena-e5-closed
          path: e5-results/
          retention-days: 90
      - name: Report
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "E5 run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} status ${{ job.status }} commit ${{ github.sha }} artifact novaathena-e5-closed"
